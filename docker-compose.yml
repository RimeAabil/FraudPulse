networks:
  fraudpulse_net:
    driver: bridge

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  mongo_data:
  spark_checkpoints:

services:

  # ─────────────────────────────────────────────
  # KAFKA CLUSTER (KRaft - 3 Brokers)
  # ─────────────────────────────────────────────
  kafka-1:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-1
    restart: unless-stopped
    env_file: .env
    ports:
      - "${KAFKA_1_EXTERNAL_PORT:-9093}:9092"
      - "9404:9404"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
      - ./config/kafka/kraft-broker-1.properties:/etc/kafka/kafka.properties:ro
      - ./scripts/format_kraft_storage.sh:/format_kraft_storage.sh:ro
    entrypoint: [ "/bin/sh", "/format_kraft_storage.sh" ]
    networks:
      - fraudpulse_net
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 29092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  kafka-2:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-2
    restart: unless-stopped
    env_file: .env
    ports:
      - "${KAFKA_2_EXTERNAL_PORT:-9094}:9092"
      - "9405:9404"  # JMX port
    volumes:
      - kafka_2_data:/var/lib/kafka/data
      - ./config/kafka/kraft-broker-2.properties:/etc/kafka/kafka.properties:ro
      - ./scripts/format_kraft_storage.sh:/format_kraft_storage.sh:ro
    entrypoint: [ "/bin/sh", "/format_kraft_storage.sh" ]
    networks:
      - fraudpulse_net
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 29092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  kafka-3:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-3
    restart: unless-stopped
    env_file: .env
    ports:
      - "${KAFKA_3_EXTERNAL_PORT:-9096}:9092"
      - "9406:9404"  # JMX port
    volumes:
      - kafka_3_data:/var/lib/kafka/data
      - ./config/kafka/kraft-broker-3.properties:/etc/kafka/kafka.properties:ro
      - ./scripts/format_kraft_storage.sh:/format_kraft_storage.sh:ro
    entrypoint: [ "/bin/sh", "/format_kraft_storage.sh" ]
    networks:
      - fraudpulse_net
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 29092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - fraudpulse_net
    volumes:
      - ./scripts/init_kafka_topics.sh:/init.sh:ro
    env_file: .env
    entrypoint: [ "/bin/bash", "/init.sh" ]
    restart: on-failure

  # ─────────────────────────────────────────────
  # MONGODB
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:6.0.12
    container_name: mongodb
    restart: unless-stopped
    env_file: .env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./src/mongo/init_mongo.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - fraudpulse_net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ─────────────────────────────────────────────
  # SPARK MASTER
  # ─────────────────────────────────────────────
  spark-master:
    build:
      context: ./src/spark
    container_name: spark-master
    restart: unless-stopped
    user: root
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - fraudpulse_net

  # ─────────────────────────────────────────────
  # SPARK WORKER 1
  # ─────────────────────────────────────────────
  spark-worker-1:
    build:
      context: ./src/spark
    container_name: spark-worker-1
    restart: unless-stopped
    user: root
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      spark-master:
        condition: service_started
    networks:
      - fraudpulse_net
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'

  # ─────────────────────────────────────────────
  # SPARK CONSUMER
  # ─────────────────────────────────────────────
  spark-consumer:
    build:
      context: ./src/spark
    container_name: spark-consumer
    restart: on-failure
    user: root
    env_file: .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      spark-master:
        condition: service_started
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - KAFKA_BROKER=kafka-1:29092,kafka-2:29092,kafka-3:29092
    volumes:
      - ./models:/app/models:ro
      - spark_checkpoints:/tmp/checkpoints
    networks:
      - fraudpulse_net
    command: >
      /opt/bitnami/spark/bin/spark-submit 
      --master spark://spark-master:7077 
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.mongodb.spark:mongo-spark-connector_2.12:10.6.1,ml.dmlc:xgboost4j_2.12:2.0.3,com.fasterxml.jackson.module:jackson-module-scala_2.12:2.15.2
      --class FraudPulseStream
      /app/fraudpulse_2.12-1.0.jar
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'

  # ─────────────────────────────────────────────
  # PRODUCER
  # ─────────────────────────────────────────────
  producer:
    build:
      context: ./src/producer
    container_name: producer
    restart: on-failure
    env_file: .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      - KAFKA_BROKER=kafka-1:29092,kafka-2:29092,kafka-3:29092
    volumes:
      - ./data/paysim.csv:/app/paysim.csv:ro
    ports:
      - "8001:8001" # Producer metrics
    networks:
      - fraudpulse_net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ─────────────────────────────────────────────
  # DASHBOARD
  # ─────────────────────────────────────────────
  dashboard:
    build:
      context: ./src/dashboard
    container_name: dashboard
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8501:8501"
    networks:
      - fraudpulse_net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

