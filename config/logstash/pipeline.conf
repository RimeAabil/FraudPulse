input {
  beats {
docker compose -f docker-compose.yml -f docker-compose.mlops.yml up -d

    port => 5044
  }
}

filter {
  if [container][name] =~ "spark-" {
    # Basic Spark log parsing (could be improved with grok for specific patterns)
    mutate {
      add_field => { "service" => "spark" }
    }
  } else if [container][name] == "producer" {
    mutate {
      add_field => { "service" => "producer" }
    }
  } else if [container][name] =~ "kafka-" {
    mutate {
      add_field => { "service" => "kafka" }
    }
  } else if [container][name] == "model-server" {
    mutate {
      add_field => { "service" => "model-server" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "fraudpulse-logs-%{+YYYY.MM.dd}"
    # user => "elastic"
    # password => "changeme"
  }
}
